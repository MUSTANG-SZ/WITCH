# Elliptical isobeta clusters plus mesa bridge fit of A399 and A401 to the ACT+Planck Compton-y map
# (/mnt/welch/ACT/bridge/comptonY/act_planck_sr_br_1.0_s19_y_map.fits).
# Two elliptical beta models, as in the paper (Hincks et al. 2022).
# Data: 80'x80' cutout binned to 1' ($WITCH_DATROOT/A399_401/act_y), made with
#   python scripts/make_act_cutout.py --ymap <y map> --out $WITCH_DATROOT/A399_401/act_y
# Noise: stationary spectrum from 12 control tiles of the same map, made with
#   python scripts/act_y_noise.py --local --ymap <y map> --out $WITCH_DATROOT/A399_401/act_y/y_noise_power.npy
# Run with a single task: witcher configs/A399_401/A399_401_ymap_isobeta_mesa_comptonY.yaml -cpu True
name: "A399_401"
fit: True
sim: False
sub: True
wnoise: False
par_offset: 1.0
n_rounds: 5
map: True
model_map: True

constants:
  Te: 7.5 # keV, between the Suzaku/XMM values of A399 and A401
  freq: "97e9"
  z: 0.072735 # Mean of the cluster redshifts, used for the bridge and the unit conversion

mcmc:
  run: False

paths:
  maps: "A399_401/act_y"
  outroot: ""
  subdir: "ymap_isobeta_mesa"

# Grid origin is the midpoint of the two clusters. The grid has to cover the whole 80' map.
coords:
  r_map: "3000"
  dr: "30.0"
  dz: 30.0
  x0: "(44.612*u.deg).to(u.radian).value"
  y0: "(13.301*u.deg).to(u.radian).value"

datasets:
  acty:
    glob: "*_y_map.fits"
    ivar_glob: "*_y_ivar.fits" # all ones, the noise comes from the spectrum
    noise:
      class: "wn.NoiseSpectrum"
      args: "['self.ivar', 'self.wcs.wcs.cdelt[0]']"
      kwargs: "{'power_path': os.path.join(os.environ['WITCH_DATROOT'], 'A399_401/act_y/y_noise_power.npy')}"
    funcs:
      get_files: "amf.get_files"
      load: "amf.load_maps"
      get_info: "amf.get_info"
      make_metadata: "amf.make_metadata"
      preproc: "amf.preproc"
      postproc: "amf.postproc"
      postfit: "amf.postfit"
    beam: # arcsec, assumed 1.6' for the DR6 ILC
      fwhm1: "96"
      amp1: 1.0
      fwhm2: "96"
      amp2: 0.0
    # Pressure to compton y
    prefactor: "float(wu.get_da(cfg['constants']['z'])*wu.XMpc/wu.me)"

# Cluster starting values are the paper's 'Ellip-beta, no bridge' fit (Table 2): central offsets from
# the grid origin, r_c, axis ratio R, angle and beta. amp is calibrated to the paper's peak y.
a399:
  structures:
    isobeta:
      structure: "isobeta"
      parameters:
        dx:
          value: -511.1
          to_fit: True
        dy:
          value: -943.7
          to_fit: True
        dz:
          value: 0.0
        r_1: # core radii in arcsec, the paper's r_c and R * r_c
          value: 133.1
          to_fit: True
          priors: [60.0, 600.0]
        r_2:
          value: 113.2
          to_fit: True
          priors: [60.0, 600.0]
        r_3: # line of sight core, degenerate with amp so fixed
          value: 162.0
        theta:
          value: 0.822
          to_fit: True
          priors: [-2.0, 2.0]
        beta:
          value: 0.657
          to_fit: True
          priors: [0.3, 2.0]
        amp:
          value: 0.0303
          to_fit: True
          priors: [0.0, 1.0e3]

a401:
  structures:
    isobeta:
      structure: "isobeta"
      parameters:
        dx:
          value: 452.2
          to_fit: True
        dy:
          value: 995.5
          to_fit: True
        dz:
          value: 0.0
        r_1: # core radii in arcsec, the paper's r_c and R * r_c
          value: 132.3
          to_fit: True
          priors: [60.0, 600.0]
        r_2:
          value: 107.2
          to_fit: True
          priors: [60.0, 600.0]
        r_3: # line of sight core, degenerate with amp so fixed
          value: 144.0
        theta:
          value: 1.15
          to_fit: True
          priors: [-2.0, 2.0]
        beta:
          value: 0.696
          to_fit: True
          priors: [0.3, 2.0]
        amp:
          value: 0.0571
          to_fit: True
          priors: [0.0, 1.0e3]


# The bridge, the paper's flat topped "mesa" (Eq. 5) with its axis along the line joining the clusters.
# amp is in the units of the integrated pressure, A_fil in y is amp * the dataset prefactor (5.56e-6).
# Start values are the paper's Table 2: centre (44.68, 13.37), l0 = 12.3', w0 = 10.8', A_fil = 1.1e-5.
bridge:
  structures:
    mesa_2d:
      structure: "mesa_2d"
      parameters:
        dx:
          value: 238.0
          to_fit: True
          priors: [-600.0, 900.0]
        dy:
          value: 248.0
          to_fit: True
          priors: [-600.0, 900.0]
        l0:
          value: 738.0
          to_fit: True
          priors: [200.0, 1800.0]
        w0:
          value: 648.0
          to_fit: True
          priors: [200.0, 1800.0]
        theta:
          value: 1.108
        amp:
          value: 1.98
          to_fit: True
          priors: [0.0, 20.0]

metamodel:
  models:
    - a399
    - a401
    - bridge
  model_map:
    acty:
      - a399
      - a401
      - bridge

fitting:
  maxiter: 50
  chitol: 1e-2

imports:
  astropy.units: u
  astropy.coordinates: [Angle]
  numpy: np
  os: os
  witch.utils: wu
  witch.noise: wn
  jitkasi.noise: jn
  jitkasi.solutions.maps: jm
  witch.external.act_map.funcs: amf
