# LM fit followed by a Metropolis-Hastings MCMC of the isobeta + mesa fit (Hincks et al. 2022 Fig. 4).
# Run with: witcher configs/A399_401/A399_401_ymap_isobeta_mesa_mcmc.yaml -cpu True
base: "A399_401_ymap_isobeta_mesa_comptonY.yaml"

mcmc:
  run: True
  method: "mh"
  num_steps: 10000
  num_chains: 4
  burn_in: 0.1
  proposal: "cov"
  seed: 0
