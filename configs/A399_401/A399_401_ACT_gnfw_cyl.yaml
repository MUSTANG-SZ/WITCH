# ACT-only fit of the A399-A401 pair and the filament between them (Hincks et al. 2022, arXiv:2107.04611).
# Two gNFW clusters plus a cylindrical beta model for the bridge, fit to the 98 GHz ACT map.
# Cluster positions, redshifts and the bridge geometry are from the paper (Tables 1, 2 and 4).
# The map is a 80'x80' cutout of the point source subtracted coadd, binned to 1', made with
# scripts/make_act_cutout.py --srcfree --out $WITCH_DATROOT/A399_401/act
# Run with a single task: witcher <this file>
name: "A399_401"
fit: True
sim: False
sub: True
wnoise: False
par_offset: 1.0
n_rounds: 5
map: True
model_map: True

constants:
  Te: 7.5 # keV, between the Suzaku/XMM values of A399 and A401
  freq: "97e9"
  z: 0.072735 # Mean of the cluster redshifts, used for the bridge and the unit conversion

mcmc:
  run: False

paths:
  maps: "A399_401" # ACT maps live in WITCH_DATROOT/A399_401/act
  outroot: ""
  subdir: "act_only"

# Grid origin is the midpoint of the two clusters. The grid has to cover the whole 80' map.
coords:
  r_map: "3000"
  dr: "30.0"
  dz: 30.0
  x0: "(44.612*u.deg).to(u.radian).value"
  y0: "(13.301*u.deg).to(u.radian).value"

datasets:
  act:
    noise:
      class: "wn.NoiseCMBMap"
      args: "['self.ivar', 'self.wcs.wcs.cdelt[0]']"
      kwargs: "{}"
    funcs:
      get_files: "amf.get_files"
      load: "amf.load_maps"
      get_info: "amf.get_info"
      make_metadata: "amf.make_metadata"
      preproc: "amf.preproc"
      postproc: "amf.postproc"
      postfit: "amf.postfit"
    beam: # arcsec, ~2.1' at 98 GHz
      fwhm1: "126"
      amp1: 1.0
      fwhm2: "126"
      amp2: 0.0
    # y -> uK_CMB at 97 GHz
    prefactor: "float(wu.get_da(cfg['constants']['z'])*wu.y2K_CMB(97e9, cfg['constants']['Te'])*wu.XMpc/wu.me)*1e6"

# Offsets are arcsec from the grid origin, from the paper's best fit centres
# A399 (44.473, 13.030) and A401 (44.751, 13.572)
a399:
  structures:
    gnfw:
      structure: "gnfw"
      parameters:
        dx_1:
          value: -487.0
          to_fit: True
        dy_1:
          value: -976.0
          to_fit: True
        dz_1:
          value: 0.0
        r: # arcsec per Mpc, with this choice gnfw is the same as a10
          value: "1/wu.get_da(0.071806)"
        P0:
          value: 8.403
        c500:
          value: 1.177
        m500:
          value: "8.7e14" # Table 4
          to_fit: True
          priors: ["1e14", "3e15"]
        gamma:
          value: 0.3081
        alpha:
          value: 1.051
        beta:
          value: 5.4905
        z:
          value: 0.071806

a401:
  structures:
    gnfw:
      structure: "gnfw"
      parameters:
        dx_1:
          value: 487.0
          to_fit: True
        dy_1:
          value: 976.0
          to_fit: True
        dz_1:
          value: 0.0
        r:
          value: "1/wu.get_da(0.073664)"
        P0:
          value: 8.403
        c500:
          value: 1.177
        m500:
          value: "10.2e14" # Table 4
          to_fit: True
          priors: ["1e14", "3e15"]
        gamma:
          value: 0.3081
        alpha:
          value: 1.051
        beta:
          value: 5.4905
        z:
          value: 0.073664

# The bridge. Axis is along the line joining the clusters (theta from the x axis),
# L is the full length (the paper's mesa is 2*l0 ~ 24' long) and r_c is its transverse scale.
# P0 is a guess, the amplitude is fit.
bridge:
  structures:
    cylindrical_beta:
      structure: "cylindrical_beta"
      parameters:
        dx:
          value: 0.0
          to_fit: True
          priors: [-600.0, 600.0]
        dy:
          value: 0.0
          to_fit: True
          priors: [-600.0, 600.0]
        dz:
          value: 0.0
        L:
          value: 1440.0
        theta:
          value: 1.108
          to_fit: True
          priors: [0.8, 1.4]
        P0:
          value: 0.002
          to_fit: True
          priors: [0.0, 10.0]
        r_c:
          value: 300.0
          to_fit: True
          priors: [150.0, 900.0]
        beta:
          value: 1.0

metamodel:
  models:
    - a399
    - a401
    - bridge
  model_map:
    act:
      - a399
      - a401
      - bridge

fitting:
  maxiter: 50
  chitol: 1e-2

imports:
  astropy.units: u
  astropy.coordinates: [Angle]
  numpy: np
  witch.utils: wu
  witch.noise: wn
  jitkasi.noise: jn
  jitkasi.solutions.maps: jm
  witch.external.act_map.funcs: amf
