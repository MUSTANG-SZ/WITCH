# Dry run of MOOJ1142_joint_needlet_trillium.yaml (same flags as MOOJ1142_joint_needlet_dryrun.yaml): no fit and no maps,
# JointMapper prints its lattice and the response matrix memory per MPI rank, then stops. Run it with the same layout as
# the production job (/scratch/jorlo/moo1142_joint_needlet_dryrun.sh) and check the memory before the real run.
base: "MOOJ1142_joint_needlet_trillium.yaml"
fit: False
sub: False
map: False
res_map: False
model_map: False
noise_map: False

joint_map:
  options:
    dry_run: True
