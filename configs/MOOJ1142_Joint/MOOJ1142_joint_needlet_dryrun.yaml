# Dry run of the needlet part of MOOJ1142_joint_needlet.yaml: no fit, no per-dataset maps; JointMapper prints its lattice and
# the response matrix memory per MPI rank, then stops. Run with the same number of ranks as the real run.
base: "MOOJ1142_joint_needlet.yaml"
fit: False
sub: False
map: False
res_map: False
model_map: False
noise_map: False

joint_map:
  options:
    dry_run: True
