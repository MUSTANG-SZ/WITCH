# Joint MUSTANG2 + ACT fit, built on the M2-only gNFW_rs + subcluster + point source config.
# Everything for M2 (TODs, noise, beam, grid, model, priors) is inherited unchanged.
# This adds the ACT 90 GHz map as a second dataset with its own point source model.
# Needs at least one MPI task per TOD plus one for the ACT map.
base: "../MOOJ1142/MOOJ1142_gNFW_rs_peak_subcluster.yaml"

paths:
  maps: "MOOJ1142" # ACT maps live in WITCH_DATROOT/MOOJ1142/act
  subdir: "joint_xray_peak_rs"

# The grid has to hold 3*fwhm1 of the ACT beam inside 2*r_map: 360" <= 2*180"
coords:
  r_map: "3.0*60"

datasets:
  act:
    noise:
      class: "jm.NoiseWhite"
      args: "['self.ivar']"
      kwargs: "{}"
    funcs:
      get_files: "amf.get_files"
      load: "amf.load_maps"
      get_info: "amf.get_info"
      make_metadata: "amf.make_metadata"
      preproc: "amf.preproc"
      postproc: "amf.postproc"
      postfit: "amf.postfit"
    # A single gaussian, the beam kernel is truncated at 1.5*fwhm1 so a wide second component is cut off
    beam:
      fwhm1: "120"
      amp1: 1.0
      fwhm2: "120"
      amp2: 0.0
    # y -> uK_CMB at 97 GHz
    prefactor: "float(wu.get_da(cfg['constants']['z'])*wu.y2K_CMB(97e9, cfg['constants']['Te'])*wu.XMpc/wu.me)*1e6"
    point_sources:
      - "ps_act"

# The ACT view of the M2 point source. Point sources skip the beam and prefactor so
# sigma is the ACT beam and amp is in uK_CMB. The position is tied to ps_model below,
# so value, to_fit, and priors of dx_g/dy_g have to match ps_model.
ps_act:
  structures:
    ps_gauss:
      structure: "gaussian"
      parameters:
        dx_g:
          value: 1.91
          to_fit: True
        dy_g:
          value: -4.04
          to_fit: True
        sigma: # arcsec, ACT beam
          value: "120.0/2.3548"
        amp_g: # uK_CMB
          value: 100.0
          to_fit: True
          priors: [0.0, 5000.0]

metamodel:
  models:
    - cluster_model
    - ps_model
    - ps_act
  model_map:
    mustang2:
      - cluster_model
      - ps_model
    act:
      - cluster_model
      - ps_act
  # Each tied parameter has to come after its master
  parameter_map:
    - [ps_model.ps_gauss.dx_g, ps_act.ps_gauss.dx_g]
    - [ps_model.ps_gauss.dy_g, ps_act.ps_gauss.dy_g]

imports:
  jitkasi.solutions.maps: jm
  witch.external.act_map.funcs: amf
  witch.utils: wu
