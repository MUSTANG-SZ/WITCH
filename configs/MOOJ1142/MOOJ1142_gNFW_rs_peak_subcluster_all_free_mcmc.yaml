# MH settings as MOOJ1142_gNFW_rs_peak_subcluster_mcmc.yaml but 8x longer chains:
# with the full gNFW shape free the autocorrelation time is ~1700 steps, and a 10000 step run
# had split Rhat up to ~2, so aim for ~50 autocorrelation times per chain.
# Separate subdir so the earlier 10000 step run in xray_peak_rs_all_free is kept.
base: "MOOJ1142_gNFW_rs_peak_subcluster_all_free.yaml"

paths:
  subdir: "xray_peak_rs_all_free_80k"

mcmc:
  run: true
  method: mh
  num_steps: 80000
  num_chains: 4
  burn_in: 0.2
  prior_type: uniform
  proposal: cov
