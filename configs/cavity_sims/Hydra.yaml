# Hydra A (Abell 780) cavity sim injected into the real Abell780 TODs (E and F fields)
# The TODs, pointing, beam, and grid all come from the Abell780 data config
# so the sim matches what we expect to see in those maps
base: "../Abell780/Abell780_total.yaml"

# Cluster name
# Used both for the output path as well as to load presets
name: "Hydra"
sim: True # If True use TODs to make noise and add a simulated cluster
noise_map: True

constants:
  z: 0.05
  # Offset in arcsec of the Hydra A core (09:18:05.651 -12:05:43.99) from the map center (x0, y0)
  # dx is along +RA (east) on the sky, dy along +Dec
  # The structure offsets below are relative to the core (Wise 2007) plus this offset
  dx_c: 9.5
  dy_c: -71.5

datasets:
  mustang2:
    # Transfer function applied to the simulated signal only, never when fitting
    xfer: "/home/jorlo/dev/minkasi_jax/data/M2/transfer_functions/xfer_Function_3p5_21Aonly_PCA5_0f08Filtering.txt"

metamodel:
  models:
    - cluster_model

cluster_model:
  structures:
    a10:
      structure: "a10"
      parameters:
        dx_1:
          value: "constants['dx_c']"
        dy_1:
          value: "constants['dy_c']"
        dz_1:
          value: 0.0
        theta:
          value: 0.0
        P0:
          value: 3.202
        c500:
          value: 1.083
        m500:
          value: "5.6e14"
          to_fit: False
        gamma:
          value: 0.3798
          to_fit: False
        alpha:
          value: 1.4063
        beta:
          value: 5.4905
        z:
          value: 0.05
    bubbleA:
      structure: "uniform"
      parameters:
        dx:
          value: "17.0 + constants['dx_c']" # From Wise 2007
        dy:
          value: "17.0 + constants['dy_c']"
        dz:
          value: 0.0
        r_1:
          value: 20.0
        r_2:
          value: 12.0
        r_3:
          value: 16.0
        theta:
          value: "np.deg2rad(-130)"
        amp:
          value: -1.0
          to_fit: True
    bubbleB:
      structure: "uniform"
      parameters:
        dx:
          value: "-17.0 + constants['dx_c']" # From Wise 2007
        dy:
          value: "-17.0 + constants['dy_c']"
        dz:
          value: 0.0
        r_1:
          value: 21.0
        r_2:
          value: 12.0
        r_3:
          value: 16.0
        theta:
          value: "np.deg2rad(-135)"
        amp:
          value: -1.0
          to_fit: True
    bubbleC:
      structure: "uniform"
      parameters:
        dx:
          value: "70.0 + constants['dx_c']" # From Wise 2007
        dy:
          value: "70.0 + constants['dy_c']"
        dz:
          value: 0.0
        r_1:
          value: 47.0
        r_2:
          value: 31.0
        r_3:
          value: 39.0
        theta:
          value: "np.deg2rad(135)"
        amp:
          value: -1.0
          to_fit: True
    bubbleD:
      structure: "uniform"
      parameters:
        dx:
          value: "-42.0 + constants['dx_c']" # From Wise 2007
        dy:
          value: "-42.0 + constants['dy_c']"
        dz:
          value: 0.0
        r_1:
          value: 29.0
        r_2:
          value: 20.0
        r_3:
          value: 25.0
        theta:
          value: "np.deg2rad(135)"
        amp:
          value: -1.0
          to_fit: True
    bubbleE:
      structure: "uniform"
      parameters:
        dx:
          value: "20.0 + constants['dx_c']" # From Wise 2007
        dy:
          value: "205.0 + constants['dy_c']"
        dz:
          value: 0.0
        r_1:
          value: 105.0
        r_2:
          value: 100.0
        r_3:
          value: 102.0
        theta:
          value: 0.0
        amp:
          value: -1.0
          to_fit: True
    bubbleF:
      structure: "uniform"
      parameters:
        dx:
          value: "-10.0 + constants['dx_c']" # From Wise 2007
        dy:
          value: "-100.0 + constants['dy_c']"
        dz:
          value: 0.0
        r_1:
          value: 68.0
        r_2:
          value: 50.0
        r_3:
          value: 59.0
        theta:
          value: "np.deg2rad(45)"
        amp:
          value: -1.0
          to_fit: True
