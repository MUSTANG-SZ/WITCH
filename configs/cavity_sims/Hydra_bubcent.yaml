# Same Hydra A sim as Hydra.yaml but mimicking the Abell780 E field only,
# which is centered on the outer cavity (bubbleE)
base: "Hydra.yaml"

# Cluster name
# Used both for the output path as well as to load presets
name: "Hydra_bubcent"

constants:
  # Offset in arcsec of the Hydra A core from the Abell780 E field center, see Hydra.yaml
  dx_c: -5.1
  dy_c: -224.0

datasets:
  mustang2:
    ntods: 41 # Number of Abell780 E field TODs
