# Joint ACT + M2 fit of the Hydra A cavity sim, placed at the MOOJ1142 pointing since
# neither Hydra A nor MS0735 is in the ACT DR6 footprint. The M2 sim is injected into
# MOOJ1142 TODs and the ACT sim into the ACT MOOJ1142 cutout (noise drawn from its ivar plus the CMB).
# The core keeps its offset from the Abell780 total pointing (see Hydra.yaml).
# Needs at least one MPI task per dataset, e.g. mpirun --bind-to none -n 9 (8 for M2, 1 for ACT).
base: "Hydra.yaml"

# Cluster name
# Used both for the output path as well as to load presets
name: "Hydra_MOO1142"

paths:
  tods: "MOOJ1142"
  maps: "MOOJ1142" # ACT maps live in WITCH_DATROOT/MOOJ1142/act
  glob: "Signal_TOD*.fits"

# The grid has to hold 3*fwhm1 of the ACT beam inside 2*r_map,
# and Hydra A is nearby so it should cover the whole 20 arcmin ACT map
coords:
  r_map: "10.0*60"
  dr: "3.0"
  dz: 3.0
  x0: "(175.69766238*u.deg).to(u.radian).value" # MOOJ1142 pointing
  y0: "(15.45364413*u.deg).to(u.radian).value"

datasets:
  # mustang2 is inherited, the transfer function is only applied to its simulated signal
  act:
    noise:
      # White noise from ivar plus a CMB covariance, the CMB dominates the map variance
      class: "wn.NoiseCMBMap"
      args: "['self.ivar', 'self.wcs.cdelt[0]']"
      kwargs: "{}"
    funcs:
      get_files: "amf.get_files"
      load: "amf.load_maps"
      get_info: "amf.get_info"
      make_metadata: "amf.make_metadata"
      preproc: "amf.preproc"
      postproc: "amf.postproc"
      postfit: "amf.postfit"
    # A single gaussian, the beam kernel is truncated at 1.5*fwhm1 so a wide second component is cut off
    beam:
      fwhm1: "2.1*60"
      amp1: 1.0
      fwhm2: "2.1*60"
      amp2: 0.0
    # y -> uK_CMB at 97 GHz
    prefactor: "float(wu.get_da(cfg['constants']['z'])*wu.y2K_CMB(97e9, cfg['constants']['Te'])*wu.XMpc/wu.me)*1e6"

metamodel:
  models:
    - cluster_model
  model_map:
    mustang2:
      - cluster_model
    act:
      - cluster_model

imports:
  jitkasi.solutions.maps: jm
  witch.external.act_map.funcs: amf
  witch.noise: wn
